<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code Skill Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>Claude Code <span class="accent">Skill Tree</span></h1>
    <div id="rankBadge" class="rank-badge-container"></div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
      <span class="progress-text" id="progressText">0 / 21</span>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="tree-container" id="treeContainer">
    <div class="levels-container" id="levelsContainer"></div>
  </div>

  <!-- Skill detail panel -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-close" id="detailClose">&times;</div>
    <div class="detail-header-row">
      <div class="detail-branch" id="detailBranch"></div>
      <div class="detail-difficulty" id="detailDifficulty"></div>
    </div>
    <h2 class="detail-name" id="detailName"></h2>
    <p class="detail-desc" id="detailDesc"></p>
    <div class="detail-try-it" id="detailTryIt"></div>
    <div class="detail-status" id="detailStatus"></div>
    <button class="detail-toggle" id="detailToggle">Mark Complete</button>
  </div>

  <!-- Reset -->
  <div class="reset-container">
    <button class="reset-btn" id="resetBtn">Reset All Progress</button>
  </div>

  <!-- Achievement toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
